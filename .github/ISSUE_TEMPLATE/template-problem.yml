name: Problem with a template
description: Report an error, outdated clause, licensing or attribution concern, misfiling, or ask for a document to be changed or removed
title: "problem: "
labels: [template-problem]
body:
  - type: input
    id: path
    attributes:
      label: Template path
      placeholder: templates/us/confidentiality/mutual-nda/common-paper-mutual-nda.md
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind of problem
      options:
        - Legal error or outdated clause
        - Wrong jurisdiction, category or subcategory
        - Licensing or attribution concern
        - I published this document and want the credit changed or the document removed
        - Typo or formatting
        - Other
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: Details
      description: Quote the clause and say what is wrong and, if you can, what it should say and why.
    validations:
      required: true
